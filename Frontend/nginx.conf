server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's built-in DNS. Looking the backend up on each request (instead of
    # once at startup) keeps nginx running even while the backend is down.
    resolver 127.0.0.11 valid=10s;
    set $backend http://spacewalk-backend:8080;

    location / {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass $backend;
    }

    location /game-hub {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
