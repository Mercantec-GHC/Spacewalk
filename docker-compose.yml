# Service names start with "spacewalk-" so they stay unique when the
# services share a network with other projects (see "networks" at the bottom).
services:
    spacewalk-backend:
        build:
            context: ./Backend
        ports:
            - "5169:8080"
        environment:
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__Redis: spacewalk-redis:6379
            Mqtt__Host: spacewalk-mosquitto
            Mqtt__Port: 1883
        depends_on:
            spacewalk-redis:
                condition: service_healthy
            spacewalk-mosquitto:
                condition: service_started
        restart: unless-stopped

    spacewalk-frontend:
        build:
            context: ./Frontend
        ports:
            - "5170:80"
        depends_on:
            - spacewalk-backend
        restart: unless-stopped

    spacewalk-redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    spacewalk-mosquitto:
        build:
            context: ./Mosquitto
        ports:
            - "${MQTT_PORT:-1883}:1883"
        volumes:
            - mosquitto_data:/mosquitto/data
        restart: unless-stopped

# Locally Compose creates its own network called "spacewalk".
# On Dokploy the Environment tab sets DOCKER_NETWORK=dokploy-network and
# DOCKER_NETWORK_EXTERNAL=true, so the existing shared network is used
# instead of creating a new one.
networks:
    default:
        name: ${DOCKER_NETWORK:-spacewalk}
        external: ${DOCKER_NETWORK_EXTERNAL:-false}

volumes:
    redis_data:
        name: H3_MMV_Redis_data
    mosquitto_data:
        name: H3_MMV_Mosquitto_data
