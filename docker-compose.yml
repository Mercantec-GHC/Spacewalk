services:
    backend:
        build:
            context: ./Backend
        ports:
            - "5169:8080"
        environment:
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__Redis: redis:6379
            Mqtt__Host: mosquitto
            Mqtt__Port: 1883
        depends_on:
            redis:
                condition: service_healthy
            mosquitto:
                condition: service_started
        restart: unless-stopped

    frontend:
        build:
            context: ./Frontend
        ports:
            - "5170:80"
        # Keeps the frontend on the project's own network (where "backend" lives)
        # when Dokploy adds its proxy network for the domain.
        networks:
            - default
        depends_on:
            - backend
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    mosquitto:
        build:
            context: ./Mosquitto
        ports:
            - "${MQTT_PORT:-1883}:1883"
        volumes:
            - mosquitto_data:/mosquitto/data
        restart: unless-stopped

volumes:
    redis_data:
        name: H3_MMV_Redis_data
    mosquitto_data:
        name: H3_MMV_Mosquitto_data
